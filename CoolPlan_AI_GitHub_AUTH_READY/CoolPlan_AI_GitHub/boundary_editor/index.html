<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    html, body, #map {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    #map {
      cursor: grab;
    }

    #hint {
      position: absolute;
      z-index: 1000;
      top: 10px;
      left: 50px;
      background: white;
      padding: 7px 10px;
      border-radius: 4px;
      font: 14px sans-serif;
      box-shadow: 0 1px 5px #777;
    }

    #controls {
      position: absolute;
      z-index: 1000;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
    }

    #controls button {
      border: 1px solid #aaa;
      background: white;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font: 14px sans-serif;
    }

    #controls button.active {
      background: #008f83;
      color: white;
      border-color: #008f83;
    }

    .leaflet-interactive {
      cursor: move;
    }
  </style>
</head>

<body>
  <div id="hint">Move mode: drag the cyan boundary</div>

  <div id="controls">
    <button id="moveBtn" class="active" type="button">
      Move
    </button>
    <button id="rotateBtn" type="button">
      Rotate
    </button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
  (function () {
    let map = null;
    let polygon = null;
    let lastSignature = null;
    let dragState = null;
    let mode = "move";

    const hint = document.getElementById("hint");
    const moveBtn = document.getElementById("moveBtn");
    const rotateBtn = document.getElementById("rotateBtn");

    function post(type, extra) {
      window.parent.postMessage(
        Object.assign(
          { isStreamlitMessage: true, type: type },
          extra || {}
        ),
        "*"
      );
    }

    function setMode(newMode) {
      mode = newMode;

      moveBtn.classList.toggle("active", mode === "move");
      rotateBtn.classList.toggle("active", mode === "rotate");

      hint.textContent = mode === "move"
        ? "Move mode: drag the cyan boundary"
        : "Rotate mode: drag the cyan boundary to rotate it";

      if (map) {
        map.getContainer().style.cursor = "grab";
      }
    }

    moveBtn.addEventListener("click", function () {
      setMode("move");
    });

    rotateBtn.addEventListener("click", function () {
      setMode("rotate");
    });

    function cleanPoints() {
      const points = polygon.getLatLngs()[0].map(
        p => [p.lat, p.lng]
      );

      if (
        points.length > 1 &&
        Math.abs(points[0][0] - points[points.length - 1][0]) < 1e-12 &&
        Math.abs(points[0][1] - points[points.length - 1][1]) < 1e-12
      ) {
        points.pop();
      }

      return points;
    }

    function finishDrag() {
      if (!dragState) return;

      dragState = null;

      map.dragging.enable();
      map.getContainer().style.cursor = "grab";

      post("streamlit:setComponentValue", {
        value: {
          coordinates: cleanPoints()
        }
      });
    }

    function startDrag(e) {
      if (e.originalEvent) {
        e.originalEvent.preventDefault();
        e.originalEvent.stopPropagation();
      }

      const originalPoints = polygon.getLatLngs()[0].map(
        p => map.latLngToContainerPoint(p)
      );

      const startPoint = map.latLngToContainerPoint(e.latlng);

      if (mode === "move") {
        dragState = {
          mode: "move",
          start: startPoint,
          original: originalPoints
        };
      } else {
        const center = L.point(0, 0);

        originalPoints.forEach(function (p) {
          center.x += p.x;
          center.y += p.y;
        });

        center.x /= originalPoints.length;
        center.y /= originalPoints.length;

        const startAngle = Math.atan2(
          startPoint.y - center.y,
          startPoint.x - center.x
        );

        dragState = {
          mode: "rotate",
          center: center,
          startAngle: startAngle,
          original: originalPoints
        };
      }

      map.dragging.disable();
      map.getContainer().style.cursor = "grabbing";
    }

    function moveDrag(e) {
      if (!dragState) return;

      const current = map.mouseEventToContainerPoint(e);

      if (dragState.mode === "move") {
        const dx = current.x - dragState.start.x;
        const dy = current.y - dragState.start.y;

        const updated = dragState.original.map(function (p) {
          return map.containerPointToLatLng(
            L.point(p.x + dx, p.y + dy)
          );
        });

        polygon.setLatLngs(updated);
        return;
      }

      const center = dragState.center;

      const currentAngle = Math.atan2(
        current.y - center.y,
        current.x - center.x
      );

      const angle = currentAngle - dragState.startAngle;

      const cosA = Math.cos(angle);
      const sinA = Math.sin(angle);

      const updated = dragState.original.map(function (p) {
        const x = p.x - center.x;
        const y = p.y - center.y;

        const rotatedX = x * cosA - y * sinA;
        const rotatedY = x * sinA + y * cosA;

        return map.containerPointToLatLng(
          L.point(
            center.x + rotatedX,
            center.y + rotatedY
          )
        );
      });

      polygon.setLatLngs(updated);
    }

    function init(args) {
      const center = args.center || [32.0924562, 74.7580475];
      const coords = args.coordinates || [];
      const signature = JSON.stringify(coords);

      if (!map) {
        map = L.map("map", {
          preferCanvas: false
        }).setView(center, 16);

        L.tileLayer(
          "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
          {
            attribution: "Esri World Imagery",
            maxZoom: 19
          }
        ).addTo(map);

        window.addEventListener("mousemove", moveDrag);
        window.addEventListener("mouseup", finishDrag);

        window.addEventListener("blur", finishDrag);
      }

      if (!polygon || signature !== lastSignature) {
        if (polygon) {
          map.removeLayer(polygon);
        }

        polygon = L.polygon(coords, {
          color: "#00FFFF",
          weight: 4,
          fillColor: "#00FFFF",
          fillOpacity: 0.18,
          bubblingMouseEvents: false
        }).addTo(map);

        lastSignature = signature;

        polygon.on("mousedown", startDrag);

        // Resize first, then zoom to the project boundary.
        setTimeout(function () {
          map.invalidateSize();

          if (polygon) {
            map.fitBounds(polygon.getBounds(), {
              padding: [20, 20],
              maxZoom: 19
            });

            // Keep the project coordinates at the center of the map.
                }
        }, 250);
      }

      setTimeout(function () {
        map.invalidateSize();
      }, 100);

      post("streamlit:setFrameHeight", {
        height: 680
      });
    }

    window.addEventListener("message", function (event) {
      const msg = event.data || {};

      if (msg.type === "streamlit:render") {
        init(msg.args || {});
      }
    });

    post("streamlit:componentReady", {
      apiVersion: 1
    });

    post("streamlit:setFrameHeight", {
      height: 680
    });
  })();
  </script>
</body>
</html>
